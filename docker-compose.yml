version: '3.8'

services:
  infraguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infraguard-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - INFRAGUARD_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SECRET_KEY=${SECRET_KEY:-infraguard_secure_production_secret_key_change_me_32chars}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/infraguard.db}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      # Mount data directory for persistent SQLite database and upload storage
      - infraguard_data:/app/data
      # Mount models directory for local YOLO weights
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  infraguard_data:
    driver: local
