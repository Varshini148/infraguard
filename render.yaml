services:
  - type: web
    name: infraguard
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    plan: standard
    disk:
      name: infraguard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: INFRAGUARD_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/infraguard.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: PROCESSED_DIR
        value: /data/processed
